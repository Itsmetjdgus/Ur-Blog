<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#66FFCC">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

   <main>
        <form class="search-form" action="blog.html" method="get">
            <input type="search" id="search-input" name="q" maxlength="50" placeholder="Search posts">
            <button type="submit">Search</button>
        </form>

        <div id="post-list">
            <p>Loading...</p>
        </div>

        <div id="pager" class="pager"></div>
    </main>

  <footer>
    <p>Tidnote</p>
  </footer>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="render.js"></script>
    <script src="blog.js"></script>
    
</body>
</html>
