<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

        <main>
        <h2>Settings</h2>

        <section class="post">
            <h3>Account privacy</h3>
            <p id="privacy-status" class="state-message">Loading...</p>

            <div id="privacy-options" hidden>
                <label class="option">
                    <input type="radio" name="privacy" value="public">
                    <span><strong>Public</strong>Anyone can see your posts. People can follow you right away.</span>
                </label>

                <label class="option">
                    <input type="radio" name="privacy" value="private">
                    <span><strong>Private</strong>Only people you approve can see your posts. Follow requests need your approval.<br><small>Note: photos are not fully protected yet. Please do not attach photos while your account is private.</small></span>
                </label>

                <button type="button" id="privacy-save">Save</button>
                <p id="privacy-message" class="form-message"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="settings.js"></script>
</body>
</html>
