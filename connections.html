<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Tidnote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 data-i18n="conn.title"></h2>

        <div class="tabs">
            <a href="connections.html?tab=requests" data-tab="requests" data-i18n="conn.requests"></a>
            <a href="connections.html?tab=followers" data-tab="followers" data-i18n="conn.followers"></a>
            <a href="connections.html?tab=following" data-tab="following" data-i18n="conn.following"></a>
        </div>

        <p id="conn-message" class="form-message"></p>
        <div id="conn-list" class="person-list"></div>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="avatar.js"></script>
    <script src="nav.js"></script>
    <script src="connections.js"></script>
</body>
</html>
