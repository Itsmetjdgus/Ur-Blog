<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#66FFCC">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <section id="author-header">
            <p>Loading...</p>
        </section>

        <form class="write-form" id="nickname-form" hidden>
            <label for="nickname">Nickname (2-20 characters, shown publicly. Do not use your email address.)</label>
            <input type="text" id="nickname" maxlength="20">
            <button type="button" id="nickname-btn">Save nickname</button>
            <p id="nickname-message" class="form-message"></p>
        </form>

        <div id="author-posts"></div>
                <section id="danger-zone" class="post" hidden>
            <h3>Delete account</h3>
            <p>This permanently deletes your account, posts, comments, and images. This cannot be undone.</p>
            <label for="delete-confirm">Type DELETE to confirm</label>
            <input type="text" id="delete-confirm" autocomplete="off">
            <button type="button" id="delete-account-btn" class="danger-btn">Delete my account</button>
            <p id="delete-message" class="form-message"></p>
        </section>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="render.js"></script>
    <script src="author.js"></script>
</body>
</html>
