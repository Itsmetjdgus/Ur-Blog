<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ur Blog</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 id="write-heading">New Post</h2>
       <form class="write-form">
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Enter title" maxlength="100">

    <label for="content">Content</label>
    <textarea id="content" rows="10" placeholder="Write your post" maxlength="20000"></textarea>
    
    <label for="image">Cover image (optional, JPG/PNG/WEBP, up to 15MB, auto-resized)</label>
<input type="file" id="image" accept="image/png,image/jpeg,image/webp">

    <button type="button" id="publish-btn">Publish</button>
    <p id="write-message" class="form-message"></p>
</form>
    </main>

    <footer>
        <p>2026 Ur Blog</p>
    </footer>

    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="image.js"></script>
    <script src="write.js"></script>
    
</body>
</html>
