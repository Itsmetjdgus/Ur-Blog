<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Write</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2 id="write-heading">New Post</h2>
       <p class="notice">Posts are visible to everyone who visits this site. Please do not share information that could identify you or other people. This site is not a counseling or emergency service, and we cannot promise that anyone will respond. If you are struggling, see <a href="help.html">Help</a>.</p>
       <p id="privacy-note" class="state-message"></p>
       <form class="write-form">
    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Enter title" maxlength="100">

    <label for="content">Content</label>
    <textarea id="content" rows="10" placeholder="Write your post" maxlength="20000"></textarea>
    
    <label for="image">Cover image (optional, JPG/PNG/WEBP, up to 15MB, auto-resized)</label>
<input type="file" id="image" accept="image/png,image/jpeg,image/webp">

    <button type="button" id="publish-btn">Publish</button>
    <p id="write-message" class="form-message"></p>
</form>
    </main>

    <footer>
        <p>2026 Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="image.js"></script>
    <script src="write.js"></script>
    <script src="write-note.js"></script>
    
</body>
</html>
