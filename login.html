<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2>Login / Sign up</h2>
        <form class="write-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 8 characters">
            <label class="check">
    <input type="checkbox" id="agree">
    <span>I am 14 or older and agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</span>
</label>
            <button type="button" id="login-btn">Log in</button>
            <button type="button" id="signup-btn">Sign up</button>
            <p class="auth-links"><a href="forgot.html">Forgot password?</a></p>
            <p id="auth-message" class="form-message"></p>
        </form>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
</body>
</html>
