<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3e7cc">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon-64.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tidnote</h1>
        <nav id="main-nav"></nav>
    </header>

    <main>
        <h2>Log in</h2>
        <form class="write-form" id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>

            <button type="submit" id="login-btn">Log in</button>
            <p class="auth-links"><a href="forgot.html">Forgot password?</a></p>
            <p id="auth-message" class="form-message"></p>
        </form>

        <p class="auth-links">New to Tidnote? <button type="button" id="open-signup-btn" class="link-button">Sign up</button></p>
    </main>

    <footer>
        <p>Tidnote</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
</body>
</html>
