<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Image</h2>
    <img src="https://picsum.photos/300/200" alt="sample image">

    <h2>Table</h2>
    <table border="1">
        <tr>
            <th>Name</th><th>Role</th><th>Year</th>
        </tr>
        <tr>
            <td>Kim</td><td>Student</td><td>2026</td>
        </tr>
    </table>

    <h2>Form</h2>
    <form>
      <label for="nick">Nickname</label>
      <input type="text" id="nick" placeholder="Enter nickname">
      <button type="button">Submit</button>
    </form>

    <h2>Grid</h2>
    <div class="gird demo">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>
